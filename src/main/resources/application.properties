spring.application.name=SecureGame

# H2 in-memory database (dev/test)
spring.datasource.url=jdbc:h2:mem:securegamedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console is disabled by default; opt in only for isolated local development.
spring.h2.console.enabled=${SECUREGAME_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# Server
server.port=8080

# Logging
logging.level.com.unime.securegame=DEBUG

# Dummy Mail Config (Required for JavaMailSender Bean)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
