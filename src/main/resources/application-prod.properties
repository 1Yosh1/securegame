# Production profile — MariaDB datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/securegamedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:securegame}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:securegame123}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Vaadin production mode
vaadin.productionMode=true

# Actuator health endpoint
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
